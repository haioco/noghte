name: Build Test APK (debug, internal)

# TEMPORARY internal workflow: builds an unsigned debug APK for a test tag
# (testbuild-*) and pushes it to a ci-apk/<tag> branch so it can be fetched
# for device testing. Not part of the official release process.
on:
  push:
    tags:
      - 'testbuild-*'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (build-tools 34.0.0, platform 34)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"; fi
          if [ -f "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-34" || true
          fi
          # Link SDK to the path expected by gradle.properties/build.sh
          sudo rm -rf /usr/lib/android-sdk
          sudo ln -sf /usr/local/lib/android/sdk /usr/lib/android-sdk
          echo "SDK setup completed"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Grant Execute Permission
        run: chmod +x gradlew build.sh

      - name: Build debug APK
        run: ./build.sh debug

      - name: Publish APK to CI branch
        run: |
          TAG="${GITHUB_REF_NAME}"
          BRANCH="ci-apk/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$BRANCH"
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/noghte-debug.apk
          /usr/lib/android-sdk/build-tools/34.0.0/aapt dump badging apk/noghte-debug.apk | grep package > apk/badging.txt || true
          sha256sum apk/noghte-debug.apk > apk/sha256.txt
          git add apk/
          git commit -m "test APK for ${TAG}"
          git push origin "$BRANCH" --force
