-- Point DNS Phase 0 — canonical dnsdist configuration (single node).
--
-- Authoritative-only: the only upstream is the local PowerDNS Authoritative
-- serving instance (127.0.0.1:5300). There is deliberately NO forwarder and no
-- external upstream in the pool — out-of-zone queries must end in REFUSED.
--
-- Placeholders @DNSDIST_WEB_PASSWORD@ / @DNSDIST_API_KEY@ are substituted at
-- install time from /etc/noghte-dns/secrets.env (see install.sh / harden.sh).

setLocal("0.0.0.0:53", { reusePort = true })

-- The single backend: the local read-only serving instance.
newServer({ address = "127.0.0.1:5300", name = "pdns", useClientSubnet = false })

-- Accept queries from anywhere (public resolver), but never act as a forwarder
-- for other nameservers.
setACL({ "0.0.0.0/0", "::/0" })

setPayloadSizeOnSelfGeneratedAnswers(1232)

-- Phase 0 policy rules (ordered; first match wins):
--   1. CHAOS class (id.server / version.bind / hosts.bind) -> REFUSED.
--      dnsdist otherwise answers id.server with the hostname, which leaks the
--      VM name. Numeric 3 (CHAOS) on purpose: DNSClass.CH is nil on
--      dnsdist 1.8.x.
--   2. ANY (type 255) -> REFUSED on both UDP and TCP.
--      Numeric 255 on purpose: the DNSQType.ANY constant is unreliable on
--      dnsdist 1.8.x, and an AndRule/TCPRule wrapper does not match ANY there.
--   3. UPDATE -> NOTIMP (dynamic updates are out of scope).
addAction(QClassRule(3), RCodeAction(DNSRCode.REFUSED))
addAction(QTypeRule(255), RCodeAction(DNSRCode.REFUSED))
addAction(OpcodeRule(DNSOpcode.Update), RCodeAction(DNSRCode.NOTIMP))

setMaxTCPConnectionsPerClient(20)
setMaxTCPQueriesPerConnection(100)

local dbr = dynBlockRulesGroup()
dbr:setQueryRate(300, 10, "Query rate exceeded", 60, DNSAction.Truncate)
dbr:setRCodeRate(DNSRCode.REFUSED, 100, 10, "Too many REFUSED", 60)
dbr:setRCodeRate(DNSRCode.NXDOMAIN, 200, 10, "NXDOMAIN flood", 60, DNSAction.Truncate)
function maintenance() dbr:apply() end

webserver("127.0.0.1:8083")
setWebserverConfig({
  password = "@DNSDIST_WEB_PASSWORD@",
  apiKey = "@DNSDIST_API_KEY@",
  acl = "127.0.0.1/32",
})